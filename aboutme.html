<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <h1 id="forbidden" hidden>Error 403 Forbidden</h1>
    <p id="status">Redirecting...</p>

    <script>
        const start = new Date(2026, 5, 17, 0, 0, 0);
        const end = new Date(2026, 5, 24, 0, 0, 0);
        const now = new Date();

        if (now >= start && now < end) {
            document.title = "Temporarily Removed";
            document.getElementById("forbidden").hidden = false;
            document.getElementById("status").textContent =
                "This page has been temporarily removed. Reason: You know who you are.";
        } else {
            window.location.replace("https://techitall.straw.page");
        }
    </script>
</body>
</html>
