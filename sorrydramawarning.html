<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, nofollow">
	<meta name="googlebot" content="noindex, nofollow">
	<link rel="icon" type="image/x-icon" href="assets/jcjensonlogo.ico">
	<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
	<title>Content Removed - JcJenson</title>
	<style>
		@font-face {
			font-family: 'HomeVideo';
			src: url('fonts/HomeVideo-BLG6G.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background:
				repeating-linear-gradient(
					45deg,
					rgba(0, 0, 0, 0.35),
					rgba(0, 0, 0, 0.35) 10px,
					rgba(20, 0, 0, 0.45) 10px,
					rgba(20, 0, 0, 0.45) 20px
				),
				linear-gradient(#2a0000, #060303);
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			font-family: Arial, sans-serif;
			padding: 20px;
			position: relative;
			overflow: hidden;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			background:
				radial-gradient(circle at 20% 15%, rgba(120, 0, 0, 0.2), transparent 40%),
				radial-gradient(circle at 80% 70%, rgba(80, 0, 0, 0.18), transparent 45%),
				radial-gradient(circle at 50% 100%, rgba(0, 0, 0, 0.65), transparent 60%);
			pointer-events: none;
			z-index: 0;
		}

		.main {
			width: min(1024px, 95vw);
			min-height: 698px;
			background: linear-gradient(180deg, #2c2c2c 0%, #1f1f1f 100%);
			border: 8px solid black;
			box-shadow: 0 0 0 2px #4a0000 inset, 0 0 45px rgba(0, 0, 0, 0.7);
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			padding: 30px 20px;
			text-align: center;
			position: relative;
			z-index: 1;
		}

		.mainlogo {
			margin-bottom: 80px;
		}

		.mainlogo img {
			width: 360px;
			max-width: 90%;
			height: auto;
		}

		.font-homevideo {
			font-family: 'HomeVideo', sans-serif;
		}

		h1 {
			font-size: 42px;
			color: #ffd3d3;
			margin-bottom: 18px;
			text-shadow: 0 0 10px rgba(190, 20, 20, 0.4);
			letter-spacing: 1px;
		}

		p {
			color: #f4dede;
			line-height: 1.7;
			max-width: 760px;
			margin: 0 0 24px 0;
			font-size: 18px;
		}

		.warning-box {
			border: 2px solid #8d1414;
			background: rgba(10, 0, 0, 0.4);
			padding: 16px 20px;
			margin-bottom: 24px;
			width: min(760px, 100%);
			box-shadow: 0 0 24px rgba(100, 0, 0, 0.28);
		}

		.home-link {
			margin-top: 6px;
			padding: 12px 24px;
			background-color: #1b1b1b;
			color: #ff8f8f;
			border: 2px solid #ad2d2d;
			text-decoration: none;
			font-family: 'HomeVideo', sans-serif;
			font-size: 16px;
			transition: all 0.25s ease;
			display: inline-block;
			box-shadow: 0 0 15px rgba(120, 0, 0, 0.2);
		}

		.home-link:hover {
			background-color: #ad2d2d;
			color: #fff1f1;
			text-decoration: none;
			transform: translateY(-2px);
		}

		@media (max-width: 768px) {
			h1 {
				font-size: 30px;
			}

			p {
				font-size: 16px;
			}

			.mainlogo img {
				width: 280px;
			}
		}
	</style>
</head>
<body>
	<div class="main">
		<div class="mainlogo">
			<!-- <img src="assets/jcjensonlogodissemblyver-removebg-preview.png" alt="JcJenson Logo"> -->
             <img src="assets/logobrightnobackground.png" alt="JcJenson Logo">
		</div>

		<h1 class="font-homevideo">Link Removed</h1>

		<div class="warning-box">
			<p>
				This link has been removed due to drama that I wish to avoid.
				Thanks for understanding.
			</p>
		</div>

		<a href="index.html" class="home-link">← Back to Home</a>
	</div>
</body>
</html>
